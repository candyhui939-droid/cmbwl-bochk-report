    extraction_priority: table_first

  - standard_name: casa_ratio_pct
    aliases:
      - CASA占比
      - casa占比
      - CASA ratio
      - casa ratio
      - current and savings account ratio
      - casa_ratio
    expected_unit: "%"
    extraction_priority: text_first
