      - 净利息收入
      - 淨利息收入
      - net interest income
      - NII
      - nii
      - total_nii
    expected_unit: 亿港元
    extraction_priority: table_first

  - standard_name: stage3_allowance
    aliases:
      - 三阶段减值准备
      - 第三阶段减值准备
      - stage 3 allowance
      - stage3 allowance
      - S3 allowance
      - s3_allowance
